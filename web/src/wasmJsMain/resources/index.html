<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Tienda mexicana de bienestar sexual: catálogo elegido a mano, fichas claras, pago seguro y envío discreto a todo México. Envío gratis desde $1,500.">

    <!-- Dominio canónico. El .htaccess redirige la variante sin www; esto se lo dice
         además a quien llegue por otra vía. Si cambia el dominio, cambia también en
         tools/contenido/build.py (DOMINIO) y en la regla del .htaccess. -->
    <link rel="canonical" href="https://www.passionagogo.com/">
    <meta name="rating" content="adult">

    <!-- Tarjeta al compartir el enlace en WhatsApp, Instagram o Facebook. Sin esto
         se pega una URL pelada. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Passion à gogo">
    <meta property="og:locale" content="es_MX">
    <meta property="og:title" content="Passion à gogo · Bienestar sexual con envío discreto a todo México">
    <meta property="og:description" content="Catálogo elegido a mano, fichas claras, pago seguro y envío discreto a todo México.">
    <meta property="og:url" content="https://www.passionagogo.com/">
    <meta property="og:image" content="https://www.passionagogo.com/favicon.svg">
    <meta name="twitter:card" content="summary">

    <!-- Datos estructurados de la tienda. `sameAs` es lo que une este sitio con los
         perfiles de redes como una sola entidad y no tres cosas sueltas que se
         llaman parecido. Las cuentas son «passioagogo» y el dominio
         «passionagogo.com»: la n de diferencia es así, no es una errata. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Passion à gogo",
      "url": "https://www.passionagogo.com/",
      "logo": "https://www.passionagogo.com/favicon.svg",
      "email": "contacto@passionagogo.com",
      "telephone": "+525513878451",
      "currenciesAccepted": "MXN",
      "areaServed": { "@type": "Country", "name": "México" },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Ciudad de México",
        "addressCountry": "MX"
      },
      "sameAs": [
        "https://www.instagram.com/passioagogo",
        "https://www.facebook.com/passioagogo"
      ]
    }
    </script>
    <!-- Icono de la pestaña. Reemplaza favicon.svg por el logo real cuando lo tengas;
         para máxima compatibilidad (Safari antiguo, accesos directos móviles) añade
         también un favicon.png de 180x180 y decláralo abajo. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#FBF6FA">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script type="application/javascript" src="agogo.js"></script>

    <!-- Cloudflare Turnstile (anti-bot del formulario de contacto).
         render=explicit: el widget se crea bajo demanda, no al cargar la página. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
            async defer></script>

    <!--
      Puente entre Compose (canvas) y Turnstile. La app corre dentro de un <canvas>,
      así que no puede montar el widget directamente: este helper lo gestiona en el DOM
      y expone un estado simple (idle | pending | ready | error) que Kotlin consulta.

      Modo invisible: execution:'execute' + appearance:'interaction-only' → no se
      muestra nada salvo que Cloudflare determine que hace falta interacción humana.
    -->
    <script type="application/javascript">
      window.paTurnstile = (function () {
        var widgetId = null;
        var state = { status: 'idle', token: '', error: '' };

        function ensureWidget(siteKey) {
          if (widgetId !== null) return true;
          if (!window.turnstile) return false;
          widgetId = window.turnstile.render('#turnstile-host', {
            sitekey: siteKey,
            execution: 'execute',
            appearance: 'interaction-only',
            callback: function (token) {
              state.status = 'ready';
              state.token = token;
            },
            'error-callback': function () {
              state.status = 'error';
              state.error = 'turnstile-error';
              return true;
            },
            'expired-callback': function () {
              state.status = 'idle';
              state.token = '';
            }
          });
          return true;
        }

        return {
          execute: function (siteKey) {
            state = { status: 'pending', token: '', error: '' };
            try {
              if (!ensureWidget(siteKey)) {
                state.status = 'error';
                state.error = 'script-no-cargado';
                return;
              }
              window.turnstile.reset(widgetId);
              window.turnstile.execute(widgetId);
            } catch (e) {
              state.status = 'error';
              state.error = String(e);
            }
          },
          status: function () { return state.status; },
          token: function () { return state.token; },
          error: function () { return state.error; }
        };
      })();
    </script>
</head>
<body>
<div id="loading">Cargando…</div>
<!--
  Las páginas de texto, en HTML, para quien no ejecuta JavaScript.

  No es un adorno de accesibilidad: los rastreadores de las IAs de búsqueda
  (GPTBot, ClaudeBot, PerplexityBot) leen el HTML tal y como sale del servidor y
  no ejecutan nada, así que esta lista es el único camino que tienen desde la
  portada hacia el resto del sitio. La app se dibuja en un canvas y no les deja
  ni una palabra ni un enlace.

  `main()` lo borra antes de montar Compose, igual que al mensaje de carga, para
  que nadie lo vea: ComposeViewport añade su canvas sin limpiar el <body>, así
  que lo que quede aquí se queda en pantalla.
-->
<nav id="enlaces-sin-js">
    <a href="/nosotros/">Nosotros</a>
    <a href="/preguntas-frecuentes/">Preguntas frecuentes</a>
    <a href="/devoluciones-y-garantias/">Cancelaciones, devoluciones y garantías</a>
    <a href="/terminos/">Términos y condiciones</a>
    <a href="/privacidad/">Aviso de privacidad</a>
    <a href="https://www.instagram.com/passioagogo" rel="me">Instagram</a>
    <a href="https://www.facebook.com/passioagogo" rel="me">Facebook</a>
</nav>
<!-- Contenedor del widget de Turnstile. Vacío salvo que se requiera interacción;
     va sobre el canvas para que el reto sea visible y clicable si aparece. -->
<div id="turnstile-host"></div>
</body>
</html>
