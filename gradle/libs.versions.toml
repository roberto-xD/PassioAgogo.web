[versions]
# Estas cinco se mueven juntas o no se mueven.
#
# El compilador de Kotlin solo lee klibs de su versión o anteriores: con uno viejo y
# dependencias nuevas falla con «Symbol for Any not found», que no dice nada de lo que
# pasa de verdad. Por eso subir Compose arrastra a Kotlin, y Kotlin arrastra a
# supabase-kt, a Ktor y a Coil.
#
# Se subió para traer el arreglo de CMP-8585: en el navegador móvil, la barra de
# sugerencias del teclado —Samsung y SwiftKey, que comparten motor— se comía lo
# escrito en cualquier campo de texto. Está verificado como arreglado en 1.9.0-beta02.
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
ktor = "3.6.1"
coroutines = "1.8.0"
serialization = "1.7.3"
coil3 = "3.6.3"
supabase = "3.9.0"

[libraries]
# Engine de Ktor (lo usa Coil para descargar imágenes; supabase-kt trae su propio cliente).
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil3" }

# Supabase (SDK oficial KMP). El BOM alinea las versiones de los módulos.
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
