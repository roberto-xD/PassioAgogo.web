# Configuración de Supabase CLI para este proyecto.
# El project_id es el "ref" del proyecto (aparece en la URL de la API).
# project_id = "tu-project-ref"

# ------------------------------------------------------------
# Edge Functions
# ------------------------------------------------------------
# `contact` es un endpoint PÚBLICO: lo llama el formulario de la web sin que el
# visitante haya iniciado sesión. Con verify_jwt = true (el valor por defecto),
# el gateway de Supabase rechaza la petición OPTIONS de preflight —el navegador
# no envía el header Authorization en ella— y el navegador reporta:
#
#   Response to preflight request doesn't pass access control check:
#   It does not have HTTP ok status.
#
# La función no queda desprotegida: valida los campos, verifica el token de
# Cloudflare Turnstile y limita los envíos por origen.
[functions.contact]
verify_jwt = false

# `spin` es igualmente PÚBLICO: la ruleta la gira cualquier visitante sin haber
# iniciado sesión, así que necesita el mismo trato que `contact` para que el
# preflight no lo rechace el gateway.
#
# No queda desprotegida: el premio lo sortea la propia función con los pesos de
# la base —que nunca salen al navegador— y limita los giros por origen.
[functions.spin]
verify_jwt = false

# `pago-webhook` lo llama MERCADO PAGO, no un navegador. Mercado Pago no tiene
# sesión en Supabase, así que con verify_jwt = true el gateway rechaza todos los
# avisos con 401 y los pagos se quedan en «pendiente» para siempre, sin que nada
# en la web dé señal del problema: el cobro se hizo, el aviso se perdió.
#
# No queda desprotegida, y aquí los candados importan más que en las otras dos:
#
#   1. La firma. `x-signature` trae un HMAC-SHA256 que solo puede calcular quien
#      tiene MP_WEBHOOK_SECRET. Sin firma válida no se mira el cuerpo.
#   2. El cuerpo del aviso NO se cree: dice qué pago mirar y nada más. El estado
#      y el monto se le preguntan a Mercado Pago con nuestro token.
#
# El segundo es el que de verdad sostiene esto. Sin él bastaría con acertar una
# firma para regalarse pedidos.
[functions.pago-webhook]
verify_jwt = false
